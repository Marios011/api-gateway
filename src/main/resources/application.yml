server:
  port: 9000

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: menu-service
          uri: http://menu-service:8080
          predicates:
            - Path=/api/products/**
        - id: table-service
          uri: http://table-service:8081
          predicates:
            - Path=/api/tables/**
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/orders/**
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**
