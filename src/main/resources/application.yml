server:
  port: 9000

spring:
  cloud:
    gateway:
      routes:
        - id: menu-service
          uri: http://menu-service:8080
          predicates:
            - Path=/api/products/**
        - id: table-service
          uri: http://table-service:8081
          predicates:
            - Path=/api/tables/**
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/orders/**
